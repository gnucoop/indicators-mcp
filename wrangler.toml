# Cloudflare Workers deployment (free plan: 100k requests/day).
#
# This file is the template and stays in git with a placeholder database id.
# Deploys use your own copy, wrangler.local.toml (gitignored), with the real id:
#   bunx wrangler login
#   bunx wrangler d1 create indicators-mcp     # note the database_id it prints
#   cp wrangler.toml wrangler.local.toml       # paste the id into the copy
#   bun run export:d1
#   bun run d1:import                          # uses wrangler.local.toml
#   bun run deploy:worker                      # uses wrangler.local.toml
# Keep the two files in sync when you change settings below.
name = "indicators-mcp"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
LIMITS_NOTE = "Free public endpoint: 30 tool calls per minute per IP, shared daily quota. initialize / tools/list are not counted."

[[d1_databases]]
binding = "DB"
database_name = "indicators-mcp"
# Placeholder: put the real id only in wrangler.local.toml.
# (Any value works for local `wrangler dev`, which uses this file.)
database_id = "00000000-0000-0000-0000-000000000000"

# Per-IP rate limit (Workers Rate Limiting API). Remove this block to rely only
# on the account-wide free-plan quota. Period must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
